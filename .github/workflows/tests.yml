name: Selenium Tests
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests (headless, parallel)
        env:
          HEADLESS: "1"
        run: pytest tests/test_ultimateqa.py -n 2
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/